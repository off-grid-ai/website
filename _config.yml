# Google Ads. The base tag (in _layouts/default.html) fires a page view on every
# page - that powers remarketing audiences, but on its own it counts NOTHING as a
# conversion. A conversion is only recorded when we send an explicit
# `conversion` event with a send_to of "<id>/<label>".
#
# The label is the string after the slash in the snippet Google Ads shows you
# under Goals > Conversions > <your action> > Tag setup ("Install the tag
# yourself"). Paste JUST the label here, not the whole AW-.../ prefix.
#
# Leave a label empty and no conversion event is sent for that plan - the site
# keeps working and the page view still fires. So it is safe to ship this before
# the actions exist in Google Ads.
# One "Subscribe" conversion action covers all three buy buttons. Each button
# still reports its own value - $69 lifetime, $49 annual, $0.99 trial - so the
# plans stay distinguishable by value in reporting.
#
# The label is the "Conversion label" field on the action's Tag setup page
# (Goals > Conversions > View all conversion actions > the action). Empty means
# no conversion is sent, so it is safe to ship without one.
google_ads_id: "AW-18343342706"
google_ads_conversion_label: "ZL44CP2WleAcEPLk5KpE"

# RevenueCat Web Purchase Link ids (the path segment in pay.rev.cat/<id>/...).
# Public by design - they appear in every customer's checkout URL, e.g.
# https://pay.rev.cat/<id>/<app_user_id>?email=<email>. One per product so the
# /pay page can offer the choice directly (annual vs lifetime).
revenuecat_link_annual: "awiunwnoekgjmxxk"    # offgrid_pro_annual - $49/yr
revenuecat_link_lifetime: "avvnmcnfsgbmjaee"  # Off Grid AI Lifetime Pro - $69 one-time
revenuecat_link_one_day: "ceizjfrnrgdclclr"   # Off Grid AI Pro - $1 for 24 hours
revenuecat_link_ogap: "mvayfyykkdodnvxw"      # OGAP hardware pre-order - $49

