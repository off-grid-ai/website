# `stars` is the server-rendered fallback so the strip is correct with JS off;
# assets/js/github-stars.js refreshes it from the GitHub API when the request
# succeeds. Keep these roughly current - they are a proof claim, so a number
# that reads lower than reality costs us nothing, one that reads higher does.
