# Single source of truth for Off Grid AI Pro pricing.
# Edit here → every page that uses {{ site.data.pricing.* }} updates at once
# (pay.md, pro.md, index.md, desktop.md, _layouts/default.html).
#
# NOTE: Jekyll does NOT render Liquid inside YAML front matter, so the
# `description:` SEO line on pro.md carries the numbers literally.
#
# Model: LIFETIME AND MONTHLY COHORT LADDER.
#   - Both prices rise as user slots fill (`tiers`), never down. The live
#     current tier is chosen client-side from the real cumulative customer
#     count (count.getoffgridai.co → RevenueCat Charts v3 customers_new total)
#     by assets/js/pro-pricing.js across React pages and Liquid layouts.
#     The original first-500 $50-lifetime
#     founders are grandfathered and untouched.
#   - Customers keep the price that applies when they buy or subscribe.

# First-cohort defaults and final ladder prices. Current purchase copy uses
# the shared helper; it waits for the count instead of displaying these defaults.
monthly: 4.99        # USD/month - current monthly price
lifetime: 69         # USD - current lifetime price
top_monthly: 9.99    # USD/month - final monthly price
top_lifetime: 149    # USD - final lifetime price
devices: 5
count_endpoint: "https://count.getoffgridai.co?metric=customers-new-all-time-v3"

# Stripe automatically applies the fixed USD 69.01 coupon to the $119 price.
# Publish this offer only with the Stripe checkout switch. No end date is set.
lifetime_offer:
  enabled: false
  original_price: 119
  amount_off: 69.01

# The ladder, low → high. `until` = cumulative customer count at which this
# lifetime tier closes (0 = final, no cap). These are regular prices, before offers.
tiers:
  - lifetime: 69
    monthly: 4.99
    label: "first 1,500"
    until: 1500
  - lifetime: 119
    monthly: 7.99
    label: "next 5,000"
    until: 6500
  - lifetime: 149
    monthly: 9.99
    label: "after that"
    until: 0

# Switch only after Stripe prices, secrets, webhook, and billing portal are ready.
# Stripe prices and the deployed Worker were verified on 2026-10-16.
checkout_provider: stripe
stripe_endpoint: "https://license.getoffgridai.co/stripe"
