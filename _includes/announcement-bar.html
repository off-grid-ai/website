{% assign pro = site.data.pricing.pro_boost %}
{% if pro %}
<aside class="announcement-bar" aria-label="Founding price for Off Grid AI Pro" data-pagefind-ignore>
  <div class="announcement-bar-inner">
    <span class="announcement-bar-tag" data-slot="badge">Founding price</span>
    <span class="announcement-bar-text">Off Grid AI Pro with Boost, from ${{ pro.from_monthly }}/month. Locked while you stay.</span>
    <span class="announcement-bar-short" aria-hidden="true">Pro with Boost from <strong>${{ pro.from_monthly }}</strong>/mo</span>
    <a class="announcement-bar-cta" href="{{ '/pro' | relative_url }}#buy" data-analytics-event="pro_cta_click" data-analytics-placement="announcement_bar">Get Pro -&gt;</a>
  </div>
</aside>
{% endif %}
