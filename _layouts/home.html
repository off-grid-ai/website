<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var saved;
      try { saved = localStorage.getItem('theme'); } catch (_) {}
      var theme = saved === 'light' || saved === 'dark' ? saved :
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.classList.toggle('light', theme === 'light');
      document.documentElement.style.colorScheme = theme;
    })();
  </script>


  <script>
    // Analytics vendors read the address bar: gtag's page_view and the Meta
    // Pixel's PageView both ship the full URL. RevenueCat's post-payment
    // redirect puts the buyer's EMAIL in that URL (?app_user_id=), and the
    // redemption link is a bearer token - neither may reach a vendor. Stash
    // the original query for the page's own scripts, then scrub it before any
    // vendor snippet below runs. Ad click ids (gclid, fbclid) are kept.
    (function () {
      var SENSITIVE = /^(app_user_id|redeem_url|email)$/;
      window.OG_QUERY = location.search;
      var raw = location.search;
      if (raw.charAt(0) === '?') raw = raw.slice(1);
      if (!raw) return;
      // Split on '?' as well as '&': RevenueCat appends its params to the
      // success URL with a second '?' when one is already configured.
      var pairs = raw.split(/[&?]/);
      var kept = [];
      var dropped = false;
      for (var i = 0; i < pairs.length; i++) {
        var eq = pairs[i].indexOf('=');
        var name = eq < 0 ? pairs[i] : pairs[i].slice(0, eq);
        if (SENSITIVE.test(name)) { dropped = true; continue; }
        if (pairs[i]) kept.push(pairs[i]);
      }
      if (!dropped) return;
      try {
        history.replaceState(null, '',
          location.pathname + (kept.length ? '?' + kept.join('&') : '') + location.hash);
      } catch (err) {
        /* Leave the URL alone rather than break the page. */
      }
    })();
  </script>

  <!-- Google tag (gtag.js) - page view only. Conversions are sent explicitly
       from the checkout buttons on /pro; see _config.yml (google_ads_*). -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_ads_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', {{ site.google_ads_id | jsonify }});
  </script>

  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=3137229433277919&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->

  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  {% seo %}

  <!-- WebSite schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Off Grid AI",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "description": {{ site.description | jsonify }},
    "publisher": {
      "@type": "Organization",
      "name": "Wednesday Solutions",
      "url": "https://www.wednesday.is"
    }
  }
  </script>

  <!-- WebPage schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": {{ page.title | jsonify }},
    "description": {{ page.description | default: site.description | jsonify }},
    "url": "{{ site.url }}{{ page.url }}",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Off Grid AI",
      "url": "{{ site.url }}{{ site.baseurl }}/"
    }
  }
  </script>

  <!-- BreadcrumbList schema -->
  {% if page.parent %}
  {% assign parent_page = site.pages | where: "title", page.parent | first %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1, "name": "Off Grid AI", "item": "{{ site.url }}{{ site.baseurl }}/"},
      {"@type": "ListItem", "position": 2, "name": {{ page.parent | jsonify }}, "item": "{{ site.url }}{{ parent_page.url }}"},
      {"@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ site.url }}{{ page.url }}"}
    ]
  }
  </script>
  {% endif %}

  <!-- FAQ schema -->
  {% if page.faq %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {% for item in page.faq %}
      {
        "@type": "Question",
        "name": {{ item.q | jsonify }},
        "acceptedAnswer": {"@type": "Answer", "text": {{ item.a | jsonify }}}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
  </script>
  {% endif %}
  {% include home-hints.html %}
  <link rel="stylesheet" href="{{ '/assets/preview/tokens.css' | relative_url }}?v={% include home-version.html %}">
  <link rel="stylesheet" href="{{ '/assets/preview/page.css' | relative_url }}?v={% include home-version.html %}">
  <noscript><style>.offgrid-page [style*="opacity"]{opacity:1!important}.offgrid-page [style*="transform"]{transform:none!important}</style></noscript>
  <noscript><style>.wt-window{opacity:1!important}</style></noscript>
</head>
<body>
  <div id="offgrid-home-root">{% include home-content.html %}</div>
  <script id="offgrid-home-pricing" type="application/json">{{ site.data.pricing | jsonify }}</script>

  <script src="{{ '/assets/js/site-analytics.js' | relative_url }}"></script>

       matched back to the ad that produced it. Runs after posthog.init so the
       register() call is queued on the snippet stub. -->

  <script>
    if (window.AdClickId) { AdClickId.remember(); }
  </script>

</html>
